AWSTemplateFormatVersion: 2010-09-09

Parameters:
  AWSRegion:
    Type: String
    Default: eu-west-2
  ConnectionArn:
    Type: String
  Environment:
    Type: String
    Description: The Control Tower Environment you are deploying into.
    Default: "development"
  GitHubBranch:
    Type: String
    Default: main
  GitHubOwner:
    Type: String
    Default: govuk-one-login
  GitHubRepoName:
    Type: String
    Default: "observability-infrastructure"
  KeySpec:
    Type: String
    Default: SYMMETRIC_DEFAULT
  KeyUsage:
    Type: String
    Default: ENCRYPT_DECRYPT
  PipelineName:
    Type: String
    Default: codepipeline-gitsync-core-pipeline
  SecretName:
    Type: String
  SecretsDeletionPolicy:
    Type: String
    Default: Retain
  SecretsUpdateReplacePolicy:
    Type: String
    Default: Retain
  SlackChannelId:
    Type: String
  SlackWorkspaceId:
    Type: String
  WorkingDir:
    Type: String
    Description: Working directory for IaC
    Default: "infrastructure/gitsync-core"

Resources:
  ######################################################################################################################
  # CodeBuild role
  ######################################################################################################################
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CodeBuildRole-${GitHubRepoName}"
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::Events::Rule (CloudWatch Events / EventBridge Rule)
                  - "events:PutRule"
                  - "events:DeleteRule"
                  - "events:DescribeRule"
                  - "events:PutTargets"
                  - "events:RemoveTargets"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::KMS::Key
                  - "kms:CreateAlias"
                  - "kms:CreateKey"
                  - "kms:Describe*"
                  - "kms:Decrypt*"
                  - "kms:GenerateDataKey"
                  - "kms:GetKeyRotationStatus"
                  - "kms:GetKeyPolicy"
                  - "kms:EnableKeyRotation"
                  - "kms:List*"
                  - "kms:PutKeyPolicy"
                  - "kms:ScheduleKeyDeletion"
                  - "kms:TagResource"
                  - "kms:UntagResource"
                  - "kms:Update*"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::SNS::Topic
                  - "sns:CreateTopic"
                  - "sns:DeleteTopic"
                  - "sns:GetTopicAttributes"
                  - "sns:SetTopicAttributes"
                  - "sns:ListTopics"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::SNS::TopicPolicy
                  - "sns:SetTopicAttributes"
                  - "sns:GetTopicAttributes"
                Resource: "*"
              - Resource:
                  - "*"
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Sid: CodeBuildLogs
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::Chatbot::SlackChannelConfiguration
                  - "chatbot:CreateSlackChannelConfiguration"
                  - "chatbot:UpdateSlackChannelConfiguration"
                  - "chatbot:DescribeSlackChannelConfigurations"
                  - "chatbot:DeleteSlackChannelConfiguration"
                Resource: "*"
                Sid: Chatbot
              - Effect: "Allow"
                Action:
                  # Permissions for AWS::Chatbot::SlackChannelConfiguration
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:PassRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRole
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                Resource: "*"
                Sid: IamRoleBuild
              - Resource: "*"
                Effect: Allow
                Action:
                  - cloudformation:*
                  - codepipeline:*
                  - codebuild:*
                  - codestar-connections:*
                  - codeconnections:*
                  - sts:AssumeRole # permission for assuming roles
                  - codestar:*
                  - s3:*
              - Sid: ServiceLinkRoleforRepoLink
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                Resource:
                  - "*"
              - Sid: SecretManager
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecrets
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource:
                  - "*"

  ######################################################################################################################
  # CodePipeline role
  ######################################################################################################################
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CodePipelineRole-${GitHubRepoName}"
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Action:
                  - codestar-connections:UseConnection
                Effect: Allow
              - Resource:
                  - !GetAtt Step0.Arn
                  - !GetAtt Step1.Arn
                  - !GetAtt Step2.Arn
                  - !GetAtt Step3.Arn
                Action:
                  - codebuild:StopBuild
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Effect: Allow
        - PolicyName: Archive
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: !Sub ${ArtifactBucket.Arn}/*
                Effect: Allow
                Action:
                  - s3:*

  ######################################################################################################################
  # S3 artifact bucket
  ######################################################################################################################
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${GitHubRepoName}-pipeline-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      # BucketEncryption:
      #   ServerSideEncryptionConfiguration:
      #     - ServerSideEncryptionByDefault:
      #         SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpiryRule
            Status: Enabled
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ######################################################################################################################
  # CodeBuild
  ######################################################################################################################
  Step0:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - cd infrastructure/gitsync-core/step-0
                - ./deploy.sh
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: KEYSPEC
            Value: !Ref KeySpec
          - Name: KEYUSAGE
            Value: !Ref KeyUsage
          - Name: UPDATE_REPLACE_POLICY
            Value: !Ref SecretsUpdateReplacePolicy
          - Name: DELETION_POLICY
            Value: !Ref SecretsDeletionPolicy
          - Name: REGION
            Value: !Ref AWSRegion
          - Name: REPONAME
            Value: !Ref GitHubRepoName
          - Name: STACK_NAME
            Value: Gitsync-core-step-0
          - Name: SECRETNAME
            Value: !Ref SecretName
      Name: 'gitsync-core-pipeline-step-0'
      ServiceRole: !Ref CodeBuildServiceRole

  Step1:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
            version: 0.2
            phases:
              build:
                commands:
                  - cd infrastructure/gitsync-core/step-1
                  - ./deploy.sh
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: BRANCHNAME
            Value: !Ref GitHubBranch
          - Name: CONNECTIONARN
            Value: !Ref ConnectionArn
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: STACK_NAME
            Value: Gitsync-core-step-1
          - Name: REGION
            Value: !Ref AWSRegion
          - Name: REPONAME
            Value: !Ref GitHubRepoName
          - Name: SECRETNAME
            Value: !Ref SecretName
      Name: 'gitsync-core-pipeline-step-1'
      ServiceRole: !Ref CodeBuildServiceRole

  Step2:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - cd infrastructure/gitsync-core/step-2
                - ./deploy.sh
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: STACK_NAME
            Value: GitSyncNotifications-Event-Rules
          - Name: REGION
            Value: !Ref AWSRegion
          - Name: REPONAME
            Value: !Ref GitHubRepoName
      Name: 'gitsync-core-pipeline-step-2'
      ServiceRole: !Ref CodeBuildServiceRole

  Step3:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - cd infrastructure/gitsync-core/step-3
                - ./deploy.sh
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: EVENT_RULES_STACK_NAME
            Value: GitSyncNotifications-Event-Rules
          - Name: REGION
            Value: !Ref AWSRegion
          - Name: REPONAME
            Value: !Ref GitHubRepoName
          - Name: STACK_NAME
            Value: GitSyncNotifications-Slack-Integration
          - Name: SLACK_CHANNEL_ID
            Value: !Ref SlackChannelId
          - Name: SLACK_WORKSPACE_ID
            Value: !Ref SlackWorkspaceId
      Name: 'gitsync-core-pipeline-step-3'
      ServiceRole: !Ref CodeBuildServiceRole

  #####################################################################################################################
  # CodePipeline
  #####################################################################################################################
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      PipelineType: V2
      ExecutionMode: SUPERSEDED
      Name: !Ref PipelineName
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: "Source"
            Push:
              - Branches:
                  Includes:
                    - !Ref GitHubBranch
                FilePaths:
                  Includes:
                    - !Ref WorkingDir
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              # https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html#action-reference-CodestarConnectionSource-type
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              OutputArtifacts:
                - Name: SourceCode
              Configuration:
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepoName}"
                BranchName: !Ref GitHubBranch
                ConnectionArn: !Ref ConnectionArn
                OutputArtifactFormat: CODE_ZIP # CODEBUILD_CLONE_REF or CODE_ZIP
        - Name: Deploy
          Actions:
            - Name: Step-0
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref Step0
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 1
            - Name: Approve-Step-1
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              RunOrder: 2
            - Name: Step-1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref Step1
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 3
            - Name: Step-2
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref Step2
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 4
            - Name: Step-3
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref Step3
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 5
